<!DOCTYPE html>
<html lang="en">
<!-- Renders Raymond's app icon with Raymond. Driven by render-icons.mjs,
     which calls window.renderIcon(size) and saves what it returns. -->
<head>
    <meta charset="UTF-8">
    <title>Raymond icon</title>
</head>
<body style="margin: 0; background: #000">
    <canvas id="canvas"></canvas>
    <script type="module">
        import { Camera, Material, Quad, Renderer, Scene, Sky, Sphere, Vec3, hexColor } from "../src/index.mjs";

        // A glass ball on a checkered floor at dusk, with a gold ball and a
        // glowing orb: the things a ray tracer is for. The subject sits in
        // the middle 80%, so Android's round and squircle masks keep it.
        function iconScene() {

            const scene = new Scene({
                sky: new Sky({
                    zenith: hexColor("#4a2bb8"),
                    horizon: hexColor("#ff9a5c"),
                    ground: hexColor("#2a1a6a"),
                    sunStrength: 3.0,
                    sunDirection: new Vec3(0.5, 0.35, 0.8),
                    sunColor: new Vec3(1.0, 0.8, 0.6),
                    sunSize: 0.06,
                }),
            });

            scene.add(
                new Quad(new Vec3(-30, 0, 30), new Vec3(60, 0, 0), new Vec3(0, 0, -60),
                    Material.checkered(hexColor("#efe6d8"), hexColor("#1d1f3d"), 0.6)),
                new Sphere(new Vec3(0, 1, 0), 1, Material.glass(1.5)),
                new Sphere(new Vec3(1.3, 0.5, -1.1), 0.5, Material.metal(hexColor("#ffcf7a"), 0.05)),
                new Sphere(new Vec3(-1.25, 0.3, -0.9), 0.3, Material.light(hexColor("#3fc8ff"), 2.5)));

            return scene;
        }

        const canvas = document.getElementById("canvas");
        let renderer;

        window.renderIcon = async (size, samples = 256) => {

            canvas.width = canvas.height = size;
            renderer ??= await Renderer.create(canvas);
            renderer.scene = iconScene();
            renderer.camera = new Camera({
                position: new Vec3(0, 1.25, 5.2),
                target: new Vec3(0, 1.05, -0.3),
                fov: 38 * Math.PI / 180,
            });
            renderer.maxBounces = 12;
            renderer.samplesPerFrame = 16;
            renderer.exposure = 0.9;
            renderer.reset();

            while (renderer.samples < samples) {
                renderer.render();
                await renderer.device.queue.onSubmittedWorkDone();
            }

            // A WebGPU canvas only holds its image until the frame is shown,
            // so render once more and read it in the same task.
            renderer.render();
            return canvas.toDataURL("image/png");
        };

        window.ready = true;
    </script>
</body>
</html>
