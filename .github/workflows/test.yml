name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Runners vary: the same tests have taken 5 minutes and over 20.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium for the browser tests, matching the pinned Playwright. They
      # run WebGPU on SwiftShader, Chromium's own software Vulkan.
      - run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Type declarations
        run: npm run test:types

      - name: Unit tests
        run: npm run test:unit

      - name: Browser tests
        run: npm run test:browser
